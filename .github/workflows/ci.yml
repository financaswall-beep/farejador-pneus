name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Obra 300: teto de 300 linhas por arquivo de produção (novo >300 = FALHA;
      # herdados congelados em scripts/teto-herdado.json). Roda ANTES do install
      # de propósito — é node puro e barra push de QUALQUER máquina/ferramenta.
      - name: Fiscal de tamanho (teto 300)
        if: ${{ !cancelled() }}
        run: node scripts/checar-tamanho.cjs

      - name: Checksums das migrations
        if: ${{ !cancelled() }}
        run: node scripts/check-migrations.cjs

      - name: Install dependencies
        id: dependencies
        if: ${{ !cancelled() }}
        run: npm ci

      - name: Arquitetura de pools do parceiro
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run prova-arquitetura-pools

      - name: Guardas e escopo das rotas da Matriz
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run prova-rotas-matriz

      - name: Colisões do compositor do painel
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run prova-colisoes-painel

      - name: Typecheck
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run typecheck

      - name: Unit tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm test

      - name: Integration tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test:integration

      - name: Build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run build

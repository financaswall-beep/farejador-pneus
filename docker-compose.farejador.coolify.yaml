services:
  farejador:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      FAREJADOR_ENV: ${FAREJADOR_ENV:-prod}
      PORT: ${PORT:-3000}
      # Confia apenas no proxy privado/loopback do Coolify para resolver request.ip.
      TRUST_PROXY: ${TRUST_PROXY:-loopback, linklocal, uniquelocal}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      PARTNER_DATABASE_URL: ${PARTNER_DATABASE_URL:?PARTNER_DATABASE_URL is required}
      # SOURCE_COMMIT e uma variavel predefinida do Coolify. Expor na readiness
      # permite provar exatamente qual backend esta rodando sem abrir o servidor.
      APP_COMMIT_SHA: ${SOURCE_COMMIT:?SOURCE_COMMIT is required}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_SSL: ${DATABASE_SSL:-true}
      CHATWOOT_HMAC_SECRET: ${CHATWOOT_HMAC_SECRET:?CHATWOOT_HMAC_SECRET is required}
      CHATWOOT_WEBHOOK_MAX_AGE_SECONDS: ${CHATWOOT_WEBHOOK_MAX_AGE_SECONDS:-300}
      CHATWOOT_API_BASE_URL: ${CHATWOOT_API_BASE_URL:?CHATWOOT_API_BASE_URL is required}
      CHATWOOT_API_TOKEN: ${CHATWOOT_API_TOKEN:?CHATWOOT_API_TOKEN is required}
      CHATWOOT_ACCOUNT_ID: ${CHATWOOT_ACCOUNT_ID:?CHATWOOT_ACCOUNT_ID is required}
      ADMIN_AUTH_TOKEN: ${ADMIN_AUTH_TOKEN:?ADMIN_AUTH_TOKEN is required}
      ADMIN_BEARER_FALLBACK_ENABLED: ${ADMIN_BEARER_FALLBACK_ENABLED:-false}
      # Frente de Caixa e foto sob demanda. Defaults OFF preservam rollout/rollback;
      # o Coolify deve definir ambas como true para publicar esta entrega.
      MATRIZ_CAIXA_PORTAL: ${MATRIZ_CAIXA_PORTAL:-false}
      PHOTO_REQUESTS: ${PHOTO_REQUESTS:-false}
      ORGANIC_ATTRIBUTION_ENABLED: ${ORGANIC_ATTRIBUTION_ENABLED:-false}
      ORGANIC_INSTAGRAM_PRIVATE_ENABLED: ${ORGANIC_INSTAGRAM_PRIVATE_ENABLED:-false}
      ORGANIC_FACEBOOK_PRIVATE_ENABLED: ${ORGANIC_FACEBOOK_PRIVATE_ENABLED:-false}
      # Central de publicações: configuração pode subir sem habilitar envios reais.
      MARKETING_PUBLISHER_ENABLED: ${MARKETING_PUBLISHER_ENABLED:-false}
      MARKETING_PUBLISHER_SEND_ENABLED: ${MARKETING_PUBLISHER_SEND_ENABLED:-false}
      SUPABASE_STORAGE_URL: ${SUPABASE_STORAGE_URL:-}
      SUPABASE_STORAGE_SERVICE_KEY: ${SUPABASE_STORAGE_SERVICE_KEY:-}
      MARKETING_PUBLICATIONS_BUCKET: ${MARKETING_PUBLICATIONS_BUCKET:-farejador-publications}
      MARKETING_MEDIA_MAX_MB: ${MARKETING_MEDIA_MAX_MB:-500}
      MARKETING_LIBRARY_MAX_MB: ${MARKETING_LIBRARY_MAX_MB:-20000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-sol}
      OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-30000}
      OPENAI_USD_BRL: ${OPENAI_USD_BRL:-5.5}
      AGENT_V2_MAX_OUTPUT_TOKENS: ${AGENT_V2_MAX_OUTPUT_TOKENS:-8192}
      BOT_AUDIO_ENABLED: ${BOT_AUDIO_ENABLED:-false}
      BOT_AUDIO_MODEL: ${BOT_AUDIO_MODEL:-gpt-transcribe}
      BOT_AUDIO_ALLOWED_HOSTS: ${BOT_AUDIO_ALLOWED_HOSTS:-}
      # A foto toca no Caixa somente quando o motor comprova estoque da Matriz.
      # Estas flags já governam o roteamento em produção e precisam atravessar o Compose.
      ROUTING_GEO: ${ROUTING_GEO:-false}
      ROUTING_MATRIZ_AS_STORE: ${ROUTING_MATRIZ_AS_STORE:-false}
      WHOLESALE_UNIFIED_STOCK: ${WHOLESALE_UNIFIED_STOCK:-false}
      # Chaves distintas: servidor para geocodificacao/distancia e navegador para o mapa do painel.
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GOOGLE_MAPS_BROWSER_API_KEY: ${GOOGLE_MAPS_BROWSER_API_KEY:-}
      # Etapa 9: rollout em gates separados; ambos permanecem false no deploy inicial.
      MATRIZ_CUSTOMER_IDENTITY: ${MATRIZ_CUSTOMER_IDENTITY:-false}
      MATRIZ_CUSTOMER_PRIVACY: ${MATRIZ_CUSTOMER_PRIVACY:-false}
    restart: always
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -qO- http://127.0.0.1:3000/readyz || exit 1'
      interval: 30s
      timeout: 5s
      retries: 3
